version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-container
    restart: always
    ports:
      - "5672:5672"     # AMQP（アプリ用）
      - "15672:15672"   # 管理画面
    environment:
      RABBITMQ_DEFAULT_USER: sample_user
      RABBITMQ_DEFAULT_PASS: sample_pass
