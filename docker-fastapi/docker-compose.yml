version: "3.8"

services:
  fastapi:
    image: python:3.12
    container_name: fastapi-container
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    user: "${UID}:${GID}"
